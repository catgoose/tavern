# Reverse proxy for the task board, used by smoke.sh. The app listens on
# 127.0.0.1:18081 and nginx on 127.0.0.1:18080 (host networking).
worker_processes 1;
events { worker_connections 256; }

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    upstream taskboard {
        server 127.0.0.1:18081;
    }

    server {
        listen 127.0.0.1:18080;

        location / {
            proxy_pass http://taskboard;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # SSE: pass frames through as they are written and keep idle
        # streams open. proxy_read_timeout is deliberately short here so the
        # smoke test shows the app's heartbeat keeping the stream alive; in
        # production set it well above the heartbeat interval.
        location /events {
            proxy_pass http://taskboard;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 3s;
        }
    }
}
