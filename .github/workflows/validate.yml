name: Validate

# Shared by PR Check and Pipeline so both run the same checks on every module.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  module:
    name: module (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tavern
            dir: .
          - name: tavernprom
            dir: tavernprom
          - name: tavernotel
            dir: tavernotel
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: ${{ matrix.dir }}/go.sum

      - name: Tidy, vet, test and lint
        run: make check-module MODULE=${{ matrix.dir }}

  proxy:
    name: reference app behind nginx
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Stream through the proxy
        run: make proxy-smoke

  automation:
    name: workflows and scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Lint workflows, test scripts and verify vendored assets
        run: make lint-workflows test-scripts verify-assets

  browser:
    name: reference app in a browser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/taskboard/browser/package-lock.json

      - name: Install the browser and test dependencies
        run: make browser-install PLAYWRIGHT_INSTALL_FLAGS=--with-deps

      - name: Run the browser tests
        run: make browser-test

      - name: Keep traces of failed browser tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-results
          path: examples/taskboard/browser/test-results/
          retention-days: 7
