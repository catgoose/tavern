name: Pipeline

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ github.sha }}

  test:
    if: always()
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: Require validation
        env:
          RESULT: ${{ needs.validate.result }}
        run: |
          echo "validation: $RESULT"
          test "$RESULT" = success

  # Releases only the validated commit of a push to main (or a manual run on
  # main). Scheduled runs only validate. Releases are serialized, and a rerun
  # for an already tagged commit reuses its tag.
  release:
    needs: [test]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          .github/scripts/release.sh "$GITHUB_SHA"

  close-resolved:
    if: ${{ !failure() && !cancelled() }}
    needs: [test, release]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close resolved CI issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          EXISTING=$(gh issue list --repo "$REPO" --label ci --state open --limit 1 \
            --json number --jq '.[0].number')
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue close "$EXISTING" --repo "$REPO" \
              --comment "Pipeline succeeded on \`$GITHUB_SHA\`: $RUN_URL"
          fi

  notify-failure:
    if: failure()
    needs: [test, release]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Notify CI failure
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BODY: |
            **Workflow:** `${{ github.workflow }}`
            **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **Branch:** `${{ github.ref_name }}`
            **Commit:** `${{ github.sha }}`
            **Event:** ${{ github.event_name }}
        run: |
          EXISTING=$(gh issue list --repo "$REPO" --label ci --state all --limit 1 \
            --json number,state --jq '.[0]')
          if [ -z "$EXISTING" ] || [ "$EXISTING" = "null" ]; then
            gh issue create --repo "$REPO" --title "Pipeline failure: $GITHUB_WORKFLOW" \
              --label ci --body "$BODY"
          else
            NUMBER=$(jq -r '.number' <<<"$EXISTING")
            if [ "$(jq -r '.state' <<<"$EXISTING")" = CLOSED ]; then
              gh issue reopen "$NUMBER" --repo "$REPO"
            fi
            gh issue comment "$NUMBER" --repo "$REPO" --body "$BODY"
          fi
