name: PR Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ github.sha }}

  # Required status check. It fails unless every validation job succeeded,
  # so a failed or skipped module cannot leave it green.
  test:
    if: always()
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: Require validation
        env:
          RESULT: ${{ needs.validate.result }}
        run: |
          echo "validation: $RESULT"
          test "$RESULT" = success

  notify-failure:
    # Fork and Dependabot PRs get a read-only token, so they cannot open issues.
    if: failure() && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Notify CI failure
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BODY: |
            **Workflow:** `${{ github.workflow }}`
            **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **Branch:** `${{ github.head_ref }}`
            **Commit:** `${{ github.event.pull_request.head.sha }}`
            **Triggered by:** ${{ github.actor }}
        run: |
          EXISTING=$(gh issue list --repo "$REPO" --label ci --state all --limit 1 \
            --json number,state --jq '.[0]')
          if [ -z "$EXISTING" ] || [ "$EXISTING" = "null" ]; then
            gh issue create --repo "$REPO" --title "Pipeline failure: $GITHUB_WORKFLOW" \
              --label ci --body "$BODY"
          else
            NUMBER=$(jq -r '.number' <<<"$EXISTING")
            if [ "$(jq -r '.state' <<<"$EXISTING")" = CLOSED ]; then
              gh issue reopen "$NUMBER" --repo "$REPO"
            fi
            gh issue comment "$NUMBER" --repo "$REPO" --body "$BODY"
          fi
